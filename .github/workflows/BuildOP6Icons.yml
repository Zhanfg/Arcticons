name: Build OP6 Arcticons Material You

on:
  push:
    branches:
      - feature/op6-icon-requests-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Prepare Gradle Wrapper
        run: gradle wrapper && chmod +x gradlew

      - name: Import optional APK signing certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > key.jks
            {
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'storeFile=%s/key.jks\n' "$GITHUB_WORKSPACE"
            } > keystore.properties
          fi

      - name: Build Material You release and side-by-side test APKs
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleyouRelease :app:assembleyouNightly

      - name: Validate custom package mappings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          custom=ET.parse("custom-icons/appfilter.xml").getroot()
          generated=ET.parse("app/src/main/assets/appfilter.xml").getroot()
          actual={(x.attrib.get("component"), x.attrib.get("drawable")) for x in generated.findall("item")}
          entries={(x.attrib.get("component"), x.attrib.get("drawable")) for x in custom.findall("item")}
          missing=entries-actual
          assert not missing, f"Missing custom mappings: {sorted(missing)}"
          assert len(entries)==10, f"Expected ten custom entries, got {len(entries)}"
          outputs=list(Path("app/build/outputs/apk/you/release").glob("*.apk")) + list(Path("app/build/outputs/apk/you/nightly").glob("*.apk"))
          assert len(outputs)>=2, f"Expected release+nightly APKs, got {outputs}"
          print(f"PASS: {len(entries)} icon mappings, {len(outputs)} APK outputs")
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Arcticons-Material-You-OP6
          path: |
            app/build/outputs/apk/you/release/*.apk
            app/build/outputs/apk/you/nightly/*.apk
          if-no-files-found: error
          retention-days: 30
